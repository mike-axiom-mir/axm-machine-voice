[project]
name = "axm-machine-voice"
version = "0.1.0"
description = "State-native grounded communication experiment for the AXM Machine Floor"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
